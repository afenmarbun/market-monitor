services:
  app:
    env_file:
      - .env
    build:
      context: .
      args:
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-market-monitor-key}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-pantau_pasar}
      DB_USERNAME: ${DB_USERNAME:-pantau}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      APP_KEY: ${APP_KEY:?Set APP_KEY in the production environment}
      APP_URL: ${APP_URL:-http://localhost}
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_APP_ID: ${REVERB_APP_ID:-market-monitor}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-market-monitor-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in the production environment}
      CACHE_STORE: database
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
      args:
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-market-monitor-key}
    ports: ["127.0.0.1:8080:80"]
    depends_on: [app, reverb]
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pantau_pasar}
      MYSQL_USER: ${DB_USERNAME:-pantau}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-me}
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  scheduler:
    env_file:
      - .env
    build:
      context: .
      args:
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-market-monitor-key}
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in the production environment}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-pantau_pasar}
      DB_USERNAME: ${DB_USERNAME:-pantau}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      CACHE_STORE: database
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_APP_ID: ${REVERB_APP_ID:-market-monitor}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-market-monitor-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in the production environment}
    depends_on: { db: { condition: service_healthy }, app: { condition: service_started } }
    restart: unless-stopped
  reverb:
    env_file:
      - .env
    build:
      context: .
      args:
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-market-monitor-key}
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY in the production environment}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_APP_ID: ${REVERB_APP_ID:-market-monitor}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-market-monitor-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in the production environment}
    depends_on: [app]
    restart: unless-stopped
volumes:
  db_data:
