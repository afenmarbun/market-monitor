server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /app/ { set $reverb_upstream reverb:8080; proxy_pass http://$reverb_upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_read_timeout 600s; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass app:9000; }
    location ~ /\.(?!well-known).* { deny all; }
}
